[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neraium-intelligence"
version = "0.1.0"
description = "Domain-agnostic evidence, behavioral-memory, and historical-comparison contracts for Neraium applications"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

