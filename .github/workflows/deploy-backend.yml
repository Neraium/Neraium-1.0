name: Release certified Production V2 backend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full committed SHA reachable from fix/deterministic-governed-output
        required: true
        type: string
      apply:
        description: Apply the verified image to production (false builds and plans only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: neraium-production-v2-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  RELEASE_SHA: ${{ inputs.source_sha }}
  APPLY_RELEASE: ${{ inputs.apply }}

jobs:
  release:
    if: github.ref == 'refs/heads/fix/deterministic-governed-output'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install repository locked verification dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate approved source and protected contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from scripts.production_release import BASELINE, source_manifest
          source_manifest(os.environ['RELEASE_SHA'], json.loads(BASELINE.read_text()))
          PY
          git worktree add --detach "$RUNNER_TEMP/neraium-release-source" "$RELEASE_SHA"
      - name: Verify release tooling contracts
        run: python -m pytest -q tests/test_production_release_contract.py tests/test_production_sre_deployment_contract.py tests/test_deployment_auth_contract.py tests/test_production_monitoring_contract.py
      - name: Verify candidate source product contracts
        working-directory: ${{ runner.temp }}/neraium-release-source
        run: |
          python -m pytest -q \
            tests/test_production_health.py tests/test_telemetry_scheduler.py \
            tests/test_telemetry_endpoint_result_v2.py tests/test_telemetry_analysis_service_v2.py \
            tests/test_telemetry_canonical_result_persistence.py tests/test_telemetry_authorization.py \
            tests/test_telemetry_runtime_grants.py tests/test_phase4_authenticated_scope.py tests/test_telemetry_production_config.py \
            tests/test_connector_execution.py tests/test_telemetry_ssrf.py tests/backend/test_api_health.py \
            tests/test_health.py::test_root_endpoint_returns_service_metadata \
            tests/test_health.py::test_health_endpoint_returns_ok \
            tests/test_evidence_governance.py tests/test_governance_audit_boundaries.py
      - name: Verify candidate upload certification workloads
        working-directory: ${{ runner.temp }}/neraium-release-source
        run: |
          python -m pytest -m upload_certification \
            tests/test_complete_upload_semantics.py::test_complete_10000_upload_repeat \
            tests/test_upload_robustness_benchmark.py::test_100k_upload_performance_guard
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify frozen production before building
        run: python scripts/production_release.py verify --evidence release-preflight.json
      - name: Build and certify committed source image
        run: python scripts/production_release.py build --source-sha "$RELEASE_SHA" --push --evidence release-build.json
      - name: Plan or apply through canonical image-only deployment
        run: |
          set -euo pipefail
          IMAGE_URI=$(python -c 'import json; print(json.load(open("release-build.json"))["image_uri"])')
          FLAGS=()
          if [ "$APPLY_RELEASE" = 'true' ]; then FLAGS+=(--apply); fi
          python scripts/production_release.py deploy --source-sha "$RELEASE_SHA" \
            --image-uri "$IMAGE_URI" "${FLAGS[@]}" --evidence release-deployment.json
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-v2-release-evidence
          path: release-*.json
