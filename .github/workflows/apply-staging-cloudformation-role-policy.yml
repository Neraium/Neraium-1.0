name: Apply staging CloudFormation role policy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-CFN-POLICY to apply the reviewed staging CloudFormation role policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-cloudformation-role-policy
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed staging CloudFormation role policy
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY-CFN-POLICY' }}
    runs-on: ubuntu-latest
    environment: staging-infra
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-2
      EXPECTED_ACCOUNT_ID: '680779862188'
      TARGET_ROLE_NAME: neraium-staging-cloudformation-role
      TARGET_ROLE_ARN: arn:aws:iam::680779862188:role/neraium-staging-cloudformation-role
      TARGET_POLICY_NAME: NeraiumStagingCloudFormationResources
      POLICY_FILE: .planning/neraium-staging-cloudformation-role-policy.json

    steps:
      - name: Check out protected main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5c3a
        with:
          ref: main

      - name: Verify protected ref and reviewed policy scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          test -f "$POLICY_FILE"

          jq -e . "$POLICY_FILE" >/dev/null

          jq -e '
            [.Statement[] | select(.Effect == "Allow") | .. | strings
             | select(test("ppc|production|neraium-prod"; "i"))]
            | length == 0
          ' "$POLICY_FILE" >/dev/null

          jq -e '
            [.Statement[] | select(.Effect == "Allow") | .Action
             | if type == "array" then .[] else . end
             | select(test("^(\\*|iam:(\\*|Create.*))$"; "i"))]
            | length == 0
          ' "$POLICY_FILE" >/dev/null

          jq -e '
            [.Statement[] | select(.Sid == "CreateChildrenOnlyInTaggedStagingVpc")]
            | length == 1
            and .[0].Effect == "Allow"
            and ((.[0].Action | if type == "array" then sort else [.] end)
                 == ["ec2:CreateRouteTable", "ec2:CreateSecurityGroup", "ec2:CreateSubnet"])
            and .[0].Resource == "arn:aws:ec2:us-east-2:680779862188:vpc/*"
            and .[0].Condition.StringEquals."aws:RequestedRegion" == "us-east-2"
            and .[0].Condition.StringEquals."aws:ResourceTag/Application" == "Neraium"
            and .[0].Condition.StringEquals."aws:ResourceTag/Environment" == "staging"
            and .[0].Condition.ArnLike."ec2:Vpc" == "arn:aws:ec2:us-east-2:680779862188:vpc/*"
          ' "$POLICY_FILE" >/dev/null

          echo 'Policy source is valid JSON and remains constrained to the reviewed staging scope.'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and exact target role
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$AWS_REGION" == "us-east-2" ]]
          [[ "$EXPECTED_ACCOUNT_ID" == "680779862188" ]]
          [[ "$TARGET_ROLE_NAME" == "neraium-staging-cloudformation-role" ]]
          [[ "$TARGET_POLICY_NAME" == "NeraiumStagingCloudFormationResources" ]]
          [[ "$POLICY_FILE" == ".planning/neraium-staging-cloudformation-role-policy.json" ]]

          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account" == "$EXPECTED_ACCOUNT_ID" ]]

          aws iam get-role --role-name "$TARGET_ROLE_NAME" --output json > /tmp/target-role.json
          jq -e --arg arn "$TARGET_ROLE_ARN" '.Role.Arn == $arn' /tmp/target-role.json >/dev/null

      - name: Apply reviewed inline policy exactly once
        shell: bash
        run: |
          set -Eeuo pipefail
          aws iam put-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"

      - name: Verify exact applied policy
        shell: bash
        run: |
          set -Eeuo pipefail
          aws iam get-role-policy \
            --role-name "$TARGET_ROLE_NAME" \
            --policy-name "$TARGET_POLICY_NAME" \
            --query PolicyDocument \
            --output json > /tmp/live-cloudformation-role-policy.json

          jq -S 'def canonical:
            if type == "object" then with_entries(.value |= canonical)
            elif type == "array" then map(canonical) | sort_by(tojson)
            else . end;
            canonical
          ' "$POLICY_FILE" > /tmp/expected-cloudformation-role-policy.json
          jq -S 'def canonical:
            if type == "object" then with_entries(.value |= canonical)
            elif type == "array" then map(canonical) | sort_by(tojson)
            else . end;
            canonical
          ' /tmp/live-cloudformation-role-policy.json > /tmp/canonical-live-cloudformation-role-policy.json
          diff -u /tmp/expected-cloudformation-role-policy.json /tmp/canonical-live-cloudformation-role-policy.json

          jq -e '
            [.Statement[] | select(.Sid == "CreateChildrenOnlyInTaggedStagingVpc")]
            | length == 1
          ' /tmp/live-cloudformation-role-policy.json >/dev/null

          {
            echo '### Staging CloudFormation role policy'
            echo
            echo "- AWS account: \`$EXPECTED_ACCOUNT_ID\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- Target role: \`$TARGET_ROLE_NAME\`"
            echo "- Inline policy: \`$TARGET_POLICY_NAME\`"
            echo '- Exact-match verification: **passed**'
          } >> "$GITHUB_STEP_SUMMARY"
