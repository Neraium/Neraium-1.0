name: Rotate Production Admin Password

on:
  workflow_dispatch:

jobs:
  rotate-admin-password:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-2
      ECS_CLUSTER: neraium-prod-cluster
      ECS_API_SERVICE: neraium-prod-api-service
      ADMIN_PASSWORD_SECRET_ARN: ${{ vars.NERAIUM_BOOTSTRAP_ADMIN_PASSWORD_SECRET_ARN }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rotate bootstrap admin password secret
        env:
          NEW_ADMIN_PASSWORD: ${{ secrets.NERAIUM_ADMIN_PASSWORD_ROTATION }}
        run: |
          set -euo pipefail

          test -n "$ADMIN_PASSWORD_SECRET_ARN"
          test -n "$NEW_ADMIN_PASSWORD"

          aws secretsmanager put-secret-value \
            --secret-id "$ADMIN_PASSWORD_SECRET_ARN" \
            --secret-string "$NEW_ADMIN_PASSWORD" \
            --region "$AWS_REGION" \
            --query 'VersionId' \
            --output text

          echo "Bootstrap admin password secret rotated."

      - name: Restart production API
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.{service:serviceName,desired:desiredCount,running:runningCount}' \
            --output table

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" \
            --region "$AWS_REGION"

          echo "Production API restarted successfully."
